<header>
  <h1>Diego Allen’s TILs</h1>
  <p>Things I’ve learned, one short note at a time.</p>
  <a href="https://github.com/dalleng/til">View the Markdown on GitHub ↗</a>
</header>
<main>
  <input type="search" id="search" placeholder="Search for any word…" aria-label="Search notes" aria-controls="notes" autocomplete="off" />
  <section class="filters" aria-label="Filter notes by category">
    <button type="button" class="tag active" aria-pressed="true">all</button>
    {categories_content}
  </section>
  {main_content}
  <p id="search-status" role="status" aria-live="polite"></p>
</main>
